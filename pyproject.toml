[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconciliation-report"
version = "0.1.0"
description = "Compare two datasets and report every way they disagree: missing rows, field mismatches, duplicate keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rafael Penço de Carvalho", email = "102534725+Rafaelcarvalho320@users.noreply.github.com" }]
keywords = ["reconciliation", "data-quality", "csv", "diff", "integration", "etl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
reconcile = "reconciler.cli:main"

[project.urls]
Homepage = "https://github.com/Rafaelcarvalho320/reconciliation-report"
Issues = "https://github.com/Rafaelcarvalho320/reconciliation-report/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reconciler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
