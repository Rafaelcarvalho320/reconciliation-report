name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

  cli:
    # Windows is not decoration here. The report contains characters a legacy
    # console code page cannot encode, which used to abort the whole run, so
    # the CLI is exercised end to end on both platforms.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Differences exit 1
        shell: bash
        run: |
          set +e
          reconcile examples/erp_orders.csv examples/shop_orders.csv \
            --key order_id --compare total,status \
            --normalize order_id=integer --normalize total=money \
            --normalize status=lower --tolerance total=0.01
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

      - name: Markdown renders on this console
        shell: bash
        run: |
          reconcile examples/erp_orders.csv examples/shop_orders.csv \
            --key order_id --compare total --format markdown || true

      - name: A file that does not exist exits 2, not 1
        shell: bash
        run: |
          set +e
          reconcile examples/erp_orders.csv nope.csv --key order_id
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }
